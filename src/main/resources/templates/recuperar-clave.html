<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Clave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container col-md-4">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 class="text-center mb-3">Recuperar Acceso</h4>
            <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

            <form th:action="@{/recuperar-clave}" method="post">
                <div class="mb-3">
                    <label class="form-label">Correo Electronico Registrado</label>
                    <input type="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
                </div>
                <button type="submit" class="btn btn-warning w-100">Enviar Clave Temporal</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/login}">Volver al Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
