<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Partido Politico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4 col-md-8">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${partido.id == null ? 'Nuevo Partido Politico' : 'Editar Partido Politico'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/partidos/guardar}" th:object="${partido}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre del Partido</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Eslogan</label>
                        <input type="text" th:field="*{eslogan}" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Presidente</label>
                        <input type="text" th:field="*{presidente}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Secretario</label>
                        <input type="text" th:field="*{secretario}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Tesorero</label>
                        <input type="text" th:field="*{tesorero}" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Pais</label>
                        <input type="text" th:field="*{pais}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Num Presidentes</label>
                        <input type="number" th:field="*{numPresidentes}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Num Gobernadores</label>
                        <input type="number" th:field="*{numGobernadores}" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Num Alcaldes</label>
                        <input type="number" th:field="*{numAlcaldes}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Num Concejales</label>
                        <input type="number" th:field="*{numConcejales}" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Num Congresistas</label>
                        <input type="number" th:field="*{numCongresistas}" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/partidos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
