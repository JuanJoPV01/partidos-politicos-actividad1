<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Partidos Politicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Partidos Politicos Registrados</h2>
        <div>
            <a th:href="@{/partidos/nuevo}" class="btn btn-success">+ Nuevo Partido</a>
            <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Pais</th>
            <th>Presidente</th>
            <th>Congresistas</th>
            <th>Alcaldes</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partidos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.pais}"></td>
            <td th:text="${p.presidente}"></td>
            <td th:text="${p.numCongresistas}"></td>
            <td th:text="${p.numAlcaldes}"></td>
            <td>
                <a th:href="@{/partidos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/partidos/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Esta seguro de eliminar este partido?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
