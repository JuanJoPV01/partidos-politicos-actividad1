<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesion - Partidos Politicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container col-md-4">
  <div class="card shadow">
    <div class="card-body p-4">
      <h3 class="text-center mb-4">Acceso al Sistema</h3>
      <div th:if="${param.error}" class="alert alert-danger">Usuario o clave incorrectos.</div>
      <div th:if="${param.logout}" class="alert alert-info">Ha cerrado sesion con exito.</div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" required placeholder="Ingresa tu usuario">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required placeholder="Ingresa tu clave">
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
      <div class="text-center mt-3">
        <a th:href="@{/recuperar-clave}">¿Olvidaste tu clave?</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
